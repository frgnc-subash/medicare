<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medicare</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <meta name="theme-color" content="#1a73e8" />
  </head>
  <body>
    <h2>Medicare</h2>

    <div class="card timer-card" id="timerContainer" style="display: none">
      <div id="timerTitle">Next Dose: <span id="nextMedName">---</span></div>
      <div id="countdown">00:00:00</div>
    </div>

    <div class="card">
      <h3>New Reminder</h3>
      <input type="text" id="medName" placeholder="Medicine Name" />
      <label>Time from now (Hours)</label>
      <input
        type="number"
        id="hoursDelay"
        placeholder="e.g. 0.5 for 30 mins"
        step="0.01"
      />
      <label>OR Specific Date/Time</label>
      <input type="datetime-local" id="exactDateTime" />
      <button onclick="addReminder()" class="btn-primary">Set Reminder</button>
      <button onclick="testNotification()" class="btn-test">
        Send Test Notification (5s)
      </button>
    </div>

    <div id="reminderList" style="width: 100%; max-width: 400px"></div>

    <script src="assets/medInfo.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
      }
    </script>
  </body>
</html>
