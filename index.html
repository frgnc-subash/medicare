<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Medicare</title>
    <link
      rel="icon"
      type="image/png"
      href="https://cdn-icons-png.flaticon.com/512/822/822143.png"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div id="app-container">
      <div class="header-bar">
        <img
          src="https://cdn-icons-png.flaticon.com/512/822/822143.png"
          alt="logo"
          class="nav-logo"
        />
        <h1 class="nav-title">Medicare</h1>
      </div>
      <div class="card timer-display" id="timerContainer" style="display: none">
        <div class="timer-sub" id="timerTitle">Next Dose</div>
        <div id="countdown">00:00:00</div>
      </div>
      <div class="card">
        <label>Medicine Name</label>
        <input
          type="text"
          id="medName"
          placeholder="e.g. Advil"
          oninput="updatePreview()"
        />
        <div class="tab-container">
          <div class="tab active" id="tabRel" onclick="switchMode('rel')">
            Relative
          </div>
          <div class="tab" id="tabAbs" onclick="switchMode('abs')">
            Absolute
          </div>
        </div>
        <div id="modeRel">
          <label>Adjust Hours</label>
          <div class="stepper-container">
            <button class="step-btn" onclick="adjustHours(-1)">-1h</button>
            <button class="step-btn" onclick="adjustHours(-0.5)">-30m</button>
            <input
              type="number"
              id="hoursDelay"
              placeholder="0"
              step="0.1"
              oninput="updatePreview()"
            />
            <button class="step-btn" onclick="adjustHours(0.5)">+30m</button>
            <button class="step-btn" onclick="adjustHours(1)">+1h</button>
          </div>
          <div class="chip-container">
            <div class="chip" onclick="setQuickTime(4)">4h</div>
            <div class="chip" onclick="setQuickTime(8)">8h</div>
            <div class="chip" onclick="setQuickTime(12)">12h</div>
          </div>
        </div>
        <div id="modeAbs" style="display: none">
          <div class="abs-grid">
            <label>Select Date</label>
            <input type="date" id="absDate" oninput="updatePreview()" />
            <label>Select Time</label>
            <input type="time" id="absTime" oninput="updatePreview()" />
          </div>
        </div>
        <div id="timePreview" class="time-preview">Set a valid time</div>
        <button onclick="addReminder()" class="btn-black">Add Reminder</button>
      </div>
      <div class="list-title">Schedule</div>
      <div id="reminderList"></div>
    </div>
    <script src="assets/medInfo.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          reg.onupdatefound = () => location.reload();
        });
      }
    </script>
  </body>
</html>
