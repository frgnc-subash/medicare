<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Medicare</title>
    <link
      rel="icon"
      type="image/png"
      href="https://cdn-icons-png.flaticon.com/512/822/822143.png"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body onclick="unlockAudio()">
    <div id="app-container">
      <header class="header">
        <div style="display: flex; align-items: center; gap: 12px">
          <img
            src="https://cdn-icons-png.flaticon.com/512/822/822143.png"
            class="nav-logo"
          />
          <h1 class="nav-title">Medicare</h1>
        </div>
        <div
          id="statusDot"
          style="
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: gray;
          "
        ></div>
      </header>

      <div class="card timer-card" id="timerContainer" style="display: none">
        <div class="timer-sub" id="timerTitle">Next Dose</div>
        <div id="countdown">00:00:00</div>
      </div>

      <div class="card">
        <div class="m3-field">
          <label>Medication Name</label>
          <input type="text" id="medName" placeholder="e.g. Aspirin" />
        </div>
        <div class="m3-field">
          <label>Alarm Sound</label>
          <select id="soundSelect" onchange="previewSound()">
            <option value="noti1">Classic Chime</option>
            <option value="noti2">Medical Alert</option>
            <option value="noti3">Digital Beep</option>
            <option value="noti4">Soft Pulse</option>
          </select>
        </div>
        <div class="tab-container">
          <div class="tab active" id="tabRel" onclick="switchMode('rel')">
            Relative
          </div>
          <div class="tab" id="tabAbs" onclick="switchMode('abs')">
            Absolute
          </div>
        </div>
        <div id="modeRel">
          <label>Set Duration</label>
          <div class="stepper">
            <button class="step-btn" onclick="adjustHours(-0.5)">−</button>
            <div class="step-info">
              <span class="step-val" id="hrDisplay">0.5</span>
              <span class="step-unit">HRS</span>
            </div>
            <button class="step-btn" onclick="adjustHours(0.5)">+</button>
          </div>
        </div>
        <div id="modeAbs" style="display: none">
          <div class="abs-grid">
            <div class="abs-row">
              <div><label>Date</label><input type="date" id="absDate" /></div>
              <div><label>Time</label><input type="time" id="absTime" /></div>
            </div>
          </div>
        </div>
        <button onclick="addReminder()" class="btn-filled">Set Reminder</button>
      </div>

      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="Search..."
          oninput="render()"
        />
      </div>
      <div id="reminderList"></div>
      <div class="history-toggle" onclick="toggleHistory()" id="historyLabel">
        Show History
      </div>
      <div class="clear-history" onclick="clearHistory()" id="clearBtn">
        Clear All History
      </div>
    </div>
    <script src="assets/medInfo.js"></script>
    <script src="app.js"></script>
  </body>
</html>
